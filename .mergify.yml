scopes:
  source:
    files:
      pnpm:
        include: []
merge_queue:
  max_parallel_checks: 2
conflict_resolvers:
  - paths:
      - pnpm-lock.yaml
    strategy: pnpm
  - paths:
      - pyproject.toml
      - uv.lock
    strategy: uv
  - paths:
      - vm1-crjson-sameinsert-policy.json
    strategy: json
  - package-manager: npm
    directories:
      - /pkg
queue_rules:
  - name: vm1-pnpm-single-261007
    queue_conditions:
      - base = vm1-pnpm-single-base-261007
      - title ~= ^VM1_PNPM_SINGLE_[AB]_261007$
    merge_conditions:
      - check-success = vm1-pnpm-never-261007
    batch_size: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
  - name: vm1-pnpm-multidoc-261007
    queue_conditions:
      - base = vm1-pnpm-multidoc-base-261007
      - title ~= ^VM1_PNPM_MULTIDOC_[AB]_261007$
    merge_conditions:
      - check-success = vm1-pnpm-never-261007
    batch_size: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
  - name: vm1-pnpm-lockscalar-quoted-261007
    queue_conditions:
      - base = vm1-pnpm-lockscalar-q-base-261007
      - title ~= ^VM1_PNPM_LOCK_Q_[AB]_261007$
    merge_conditions:
      - check-success = vm1-pnpm-never-261007
    batch_size: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
  - name: vm1-pnpm-lockscalar-numeric-261007
    queue_conditions:
      - base = vm1-pnpm-lockscalar-n-base-261007
      - title ~= ^VM1_PNPM_LOCK_N_[AB]_261007$
    merge_conditions:
      - check-success = vm1-pnpm-never-261007
    batch_size: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
  - name: vm1-pnpm-peer-move-261008
    queue_conditions:
      - base = vm1-pnpm-peer-base-261008
      - title ~= ^VM1_PNPM_PEER_[AB]_261008$
    autoqueue: true
    merge_conditions:
      - check-success = vm1-pnpm-peer-never-261008
    batch_size: 2
    batch_max_wait_time: 1 minute
    merge_method: merge-batch
  - name: vm1-pnpm-dangling-261008
    queue_conditions:
      - base = vm1-pnpm-dangling-base-261008
      - title ~= ^VM1_PNPM_DANGLING_[AB]_261008$
    autoqueue: true
    merge_conditions:
      - check-success = vm1-pnpm-dangling-never-261008
    batch_size: 2
    batch_max_wait_time: 5 minutes
    merge_method: merge-batch
  - name: vm1-uv-dangling-261008
    queue_conditions:
      - base = vm1-uv-dangling-base-261008
      - title ~= ^VM1_UV_DANGLING_[AB]_261008$
    autoqueue: true
    merge_conditions:
      - check-success = vm1-uv-dangling-never-261008
    batch_size: 2
    batch_max_wait_time: 5 minutes
    merge_method: merge-batch
  - name: vm1-crjson-sameinsert-261008
    queue_conditions:
      - base = vm1-crjson-sameinsert-base-261006
      - title ~= ^VM1_CRJSON_SAMEINSERT_[AB]_261008$
    autoqueue: true
    merge_conditions:
      - check-success = vm1-crjson-sameinsert-never-261008
    batch_size: 2
    batch_max_wait_time: 5 minutes
    merge_method: merge-batch
  - name: vm1-pkgopt-261009
    queue_conditions:
      - base = vm1-pkgopt-base-261009
      - title ~= ^VM1_PKGOPT_[AB]_261009$
    autoqueue: true
    merge_conditions:
      - check-success = vm1-pkgopt-gate-261009
    batch_size: 2
    batch_max_wait_time: 5 minutes
    merge_method: merge-batch
merge_protections:
  - name: vm1-resolver-auto-finalizer-native-gate
    if:
      - base = main
    success_conditions: []
